# OpenAgents Nginx Configuration
# Domain: agents.uamgo.com
# Proxy to: localhost:8700

server {
    listen 80;
    server_name agents.uamgo.com;

    # Increase max body size for file uploads
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/agents.uamgo.com.access.log;
    error_log /var/log/nginx/agents.uamgo.com.error.log;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    # Main proxy to OpenAgents
    location / {
        proxy_pass http://localhost:8700;
        proxy_redirect off;
    }

    # Studio interface
    location /studio/ {
        proxy_pass http://localhost:8700/studio/;
        proxy_redirect off;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://localhost:8700/api/;
        proxy_redirect off;
    }

    # MCP endpoint
    location /mcp {
        proxy_pass http://localhost:8700/mcp;
        proxy_redirect off;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:8700/api/health;
        proxy_redirect off;
    }

    # Static files (if any)
    location /static/ {
        proxy_pass http://localhost:8700/static/;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}

